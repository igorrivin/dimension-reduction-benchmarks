[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dimension-reduction-benchmarks"
version = "0.1.0"
description = "Experimental autoencoder, DiRe, RAPIDS UMAP, and PCA dimension-reduction benchmarks"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Igor Rivin", email = "rivin@temple.edu"}]
requires-python = ">=3.10"
keywords = [
    "dimensionality-reduction",
    "intrinsic-dimension",
    "autoencoder",
    "rapids",
    "umap",
    "dire",
    "benchmark",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
ae = ["torch>=2.2"]
comparison = ["dire-evoc @ git+https://github.com/igorrivin/dire-evoc.git"]
dire = ["dire-rapids>=0.3,<0.4"]
monitoring = ["psutil>=5.8.0", "nvidia-ml-py>=12"]
topology = ["dire-rapids[metrics,persistent]>=0.3,<0.4", "fastdtw>=0.3.0", "ripser>=0.6.0"]
data = ["datasets>=3.0", "huggingface-hub>=0.25", "pandas>=2.0", "pyarrow>=15"]
viz = ["matplotlib>=3.8", "pandas>=2.0"]
test = ["pytest>=8", "pytest-timeout>=2.1", "black", "ruff"]

[project.urls]
Homepage = "https://github.com/igorrivin/dimension-reduction-benchmarks"
Repository = "https://github.com/igorrivin/dimension-reduction-benchmarks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313", "py314"]

[tool.ruff]
line-length = 100
src = ["src", "examples", "experiments", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
