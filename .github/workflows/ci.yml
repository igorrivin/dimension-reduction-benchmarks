name: CPU checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[ae,data,test]'
      - name: Lint
        run: ruff check src examples experiments tests
      - name: Format
        run: black --check src examples experiments tests
      - name: Test
        run: python -m pytest -q
      - name: Verify lazy import
        run: python -c "import sys, dimension_reduction_benchmarks; assert 'torch' not in sys.modules"

  single-cell-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/single-cell-prep.txt
      - name: Install preparation stack
        run: |
          python -m pip install -e '.[test]'
          python -m pip install -r requirements/single-cell-prep.txt
      - name: Verify pinned numerical stack
        run: python -c "import anndata, cellxgene_census, scanpy, skmisc.loess"
      - name: Test single-cell preparation and harness
        run: >-
          python -m pytest -q
          tests/test_single_cell_preparation.py
          tests/test_single_cell_benchmark.py
